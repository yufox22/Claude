<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indonesia Property 3D | 価格 × 販売スピード × ボリューム</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #07090f;
    --bg-1: #0c111c;
    --panel: rgba(20, 27, 45, 0.72);
    --border: rgba(120, 150, 255, 0.14);
    --text: #e8ecf6;
    --text-dim: #8a94ad;
    --accent: #4f8cff;
    --accent-2: #00d4b8;
    --accent-3: #ff5e7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", "Noto Sans JP", sans-serif;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(79,140,255,.16), transparent 60%),
      radial-gradient(800px 500px at -10% 110%, rgba(0,212,184,.10), transparent 60%),
      var(--bg-0);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 20px 28px 12px;
  }
  header .brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .02em;
    background: linear-gradient(90deg, #fff 20%, var(--accent) 60%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header .sub {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-2);
    border: 1px solid rgba(0,212,184,.35);
    border-radius: 999px;
    padding: 4px 12px;
    background: rgba(0,212,184,.07);
  }
  .container {
    display: flex;
    gap: 18px;
    padding: 8px 28px 24px;
    align-items: stretch;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .controls {
    width: 290px;
    flex-shrink: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .controls h2 {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 12px;
  }
  .controls h2:not(:first-child) { margin-top: 22px; }
  .control-group { margin-bottom: 14px; }
  .control-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  .axis-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    font-size: 10px;
    font-weight: 800;
    border-radius: 5px;
    color: #060810;
  }
  .tag-x { background: var(--accent-3); box-shadow: 0 0 10px rgba(255,94,125,.5); }
  .tag-y { background: var(--accent-2); box-shadow: 0 0 10px rgba(0,212,184,.5); }
  .tag-z { background: var(--accent);  box-shadow: 0 0 10px rgba(79,140,255,.55); }
  select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 13px;
    font-family: inherit;
    background: rgba(8,12,22,.8);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  select:hover, select:focus { border-color: rgba(79,140,255,.5); }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text);
  }
  .checkbox-row input { accent-color: var(--accent); }
  #plot-wrap {
    flex: 1;
    min-width: 0;
    padding: 10px;
    overflow: hidden;
  }
  #plot { width: 100%; height: 80vh; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-card {
    background: rgba(8,12,22,.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
  }
  .stat-card .v {
    font-size: 16px;
    font-weight: 800;
    background: linear-gradient(90deg, #fff, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-card .k {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .legend-note {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: auto;
    padding-top: 16px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<header>
  <span class="brand">INDONESIA PROPERTY 3D</span>
  <span class="sub">価格 × 販売スピード × ボリューム｜Jabodetabek＋主要都市</span>
  <span class="badge">Prototype v0.2</span>
</header>

<div class="container">
  <div class="panel controls">
    <h2>Axis</h2>

    <div class="control-group">
      <label><span class="axis-tag tag-x">X</span>価格</label>
      <select id="xAxis">
        <option value="avgPrice">平均価格（億ルピア）</option>
        <option value="sqmPrice">㎡単価（百万ルピア/㎡）</option>
      </select>
    </div>

    <div class="control-group">
      <label><span class="axis-tag tag-y">Y</span>販売スピード</label>
      <select id="yAxis">
        <option value="unitsPerMonth">月間販売戸数（戸/月）</option>
        <option value="monthsToSellout">完売所要月数（月）※小さいほど速い</option>
      </select>
    </div>

    <div class="control-group">
      <label><span class="axis-tag tag-z">Z</span>ボリューム</label>
      <select id="zAxis">
        <option value="siteArea">敷地面積（㎡）</option>
      </select>
      <div class="checkbox-row" style="margin-top:6px;">
        <input type="checkbox" id="logZ" checked>
        <label for="logZ" style="margin:0; font-weight:500;">対数スケール（桁差が大きいため推奨）</label>
      </div>
    </div>

    <h2>Display</h2>

    <div class="control-group">
      <label>色分け</label>
      <select id="colorBy">
        <option value="area">エリア別</option>
        <option value="type">物件タイプ別</option>
        <option value="status">販売ステータス別</option>
      </select>
    </div>

    <div class="control-group">
      <label>バブルサイズ</label>
      <select id="sizeBy">
        <option value="fixed">固定</option>
        <option value="siteArea">敷地面積に比例</option>
      </select>
    </div>

    <div class="control-group checkbox-row">
      <input type="checkbox" id="showLabels">
      <label for="showLabels" style="margin:0; font-weight:500;">物件名を常時表示</label>
    </div>

    <h2>Summary</h2>
    <div class="stats" id="stats"></div>

    <div class="legend-note">
      ※ データはダミー。実データ（CSV等）に差し替え可能<br>
      ※ ホバーで円換算を表示（1億ルピア ≒ 93万円で簡易換算）<br>
      ※ 凡例クリックでグループの表示/非表示
    </div>
  </div>

  <div class="panel" id="plot-wrap">
    <div id="plot"></div>
  </div>
</div>

<script>
// ===== サンプルデータ（インドネシア・ダミー） =====
// avgPrice: 億ルピア(= Rp 100 juta x 100 → miliar x 10)表記。例 25 = Rp 2.5 miliar
// sqmPrice: 百万ルピア/㎡（juta/m²）
const properties = [
  { name: "The Peak Sudirman",        area: "Jakarta CBD",  type: "高層コンド", status: "完売",   avgPrice: 85, sqmPrice: 65, unitsPerMonth: 6.5,  monthsToSellout: 14, totalUnits: 90,  siteArea: 3200 },
  { name: "Menteng Royal Residence",  area: "Jakarta Pusat", type: "高層コンド", status: "完売",  avgPrice: 72, sqmPrice: 58, unitsPerMonth: 4.2,  monthsToSellout: 16, totalUnits: 68,  siteArea: 2400 },
  { name: "Kemang Garden Heights",    area: "Jakarta Selatan", type: "中層コンド", status: "販売中", avgPrice: 45, sqmPrice: 42, unitsPerMonth: 8.0, monthsToSellout: 22, totalUnits: 180, siteArea: 6800 },
  { name: "SCBD Sky Tower",           area: "Jakarta CBD",  type: "高層コンド", status: "販売中", avgPrice: 95, sqmPrice: 72, unitsPerMonth: 5.0,  monthsToSellout: 28, totalUnits: 140, siteArea: 4100 },
  { name: "BSD Green Terrace",        area: "Tangerang",    type: "タウンハウス", status: "完売", avgPrice: 22, sqmPrice: 18, unitsPerMonth: 14.0, monthsToSellout: 18, totalUnits: 250, siteArea: 42000 },
  { name: "Alam Sutera Lakeview",     area: "Tangerang",    type: "戸建",       status: "販売中", avgPrice: 28, sqmPrice: 16, unitsPerMonth: 9.5,  monthsToSellout: 24, totalUnits: 230, siteArea: 58000 },
  { name: "Serpong Mid Park",         area: "Tangerang",    type: "中層コンド", status: "完売",   avgPrice: 14, sqmPrice: 19, unitsPerMonth: 22.0, monthsToSellout: 20, totalUnits: 440, siteArea: 18000 },
  { name: "Bekasi Grand City",        area: "Bekasi",       type: "戸建",       status: "販売中", avgPrice: 11, sqmPrice: 10, unitsPerMonth: 18.0, monthsToSellout: 30, totalUnits: 540, siteArea: 96000 },
  { name: "Cikarang Industrial Vista", area: "Bekasi",      type: "タウンハウス", status: "販売中", avgPrice: 8,  sqmPrice: 8,  unitsPerMonth: 12.0, monthsToSellout: 32, totalUnits: 380, siteArea: 72000 },
  { name: "Depok University Park",    area: "Depok",        type: "中層コンド", status: "完売",   avgPrice: 9,  sqmPrice: 13, unitsPerMonth: 16.0, monthsToSellout: 15, totalUnits: 240, siteArea: 12000 },
  { name: "Bogor Hill Estate",        area: "Bogor",        type: "戸建",       status: "販売中", avgPrice: 13, sqmPrice: 9,  unitsPerMonth: 6.0,  monthsToSellout: 36, totalUnits: 215, siteArea: 88000 },
  { name: "Sentul Highland Villas",   area: "Bogor",        type: "戸建",       status: "販売中", avgPrice: 19, sqmPrice: 11, unitsPerMonth: 4.5,  monthsToSellout: 40, totalUnits: 180, siteArea: 110000 },
  { name: "Pondok Indah Premier",     area: "Jakarta Selatan", type: "高層コンド", status: "完売", avgPrice: 58, sqmPrice: 48, unitsPerMonth: 5.5,  monthsToSellout: 18, totalUnits: 98,  siteArea: 3800 },
  { name: "Kelapa Gading Bay Walk",   area: "Jakarta Utara", type: "中層コンド", status: "販売中", avgPrice: 26, sqmPrice: 28, unitsPerMonth: 11.0, monthsToSellout: 26, totalUnits: 290, siteArea: 9500 },
  { name: "PIK Marina Residences",    area: "Jakarta Utara", type: "高層コンド", status: "販売中", avgPrice: 52, sqmPrice: 45, unitsPerMonth: 9.0,  monthsToSellout: 30, totalUnits: 270, siteArea: 7200 },
  { name: "Surabaya West One",        area: "Surabaya",     type: "高層コンド", status: "完売",   avgPrice: 24, sqmPrice: 25, unitsPerMonth: 10.0, monthsToSellout: 19, totalUnits: 190, siteArea: 5600 },
  { name: "Pakuwon Sky Loft",         area: "Surabaya",     type: "中層コンド", status: "販売中", avgPrice: 16, sqmPrice: 20, unitsPerMonth: 13.0, monthsToSellout: 23, totalUnits: 300, siteArea: 8800 },
  { name: "Bandung Valley Homes",     area: "Bandung",      type: "戸建",       status: "完売",   avgPrice: 12, sqmPrice: 12, unitsPerMonth: 7.0,  monthsToSellout: 21, totalUnits: 150, siteArea: 64000 },
  { name: "Dago Premier Hills",       area: "Bandung",      type: "タウンハウス", status: "販売中", avgPrice: 17, sqmPrice: 15, unitsPerMonth: 3.8,  monthsToSellout: 34, totalUnits: 130, siteArea: 46000 },
  { name: "Canggu Ocean Villas",      area: "Bali",         type: "ヴィラ",     status: "販売中", avgPrice: 65, sqmPrice: 38, unitsPerMonth: 2.5,  monthsToSellout: 26, totalUnits: 64,  siteArea: 32000 },
  { name: "Ubud Forest Retreat",      area: "Bali",         type: "ヴィラ",     status: "完売",   avgPrice: 48, sqmPrice: 30, unitsPerMonth: 2.0,  monthsToSellout: 22, totalUnits: 44,  siteArea: 28000 },
  { name: "Makassar Central Park",    area: "Makassar",     type: "中層コンド", status: "販売中", avgPrice: 10, sqmPrice: 14, unitsPerMonth: 8.5,  monthsToSellout: 28, totalUnits: 235, siteArea: 11000 },
];

const IDR_OKU_TO_JPY_MAN = 93; // 1億ルピア ≒ 93万円（簡易換算レート）

const metrics = {
  avgPrice:        { label: "平均価格",     unit: "億ルピア" },
  sqmPrice:        { label: "㎡単価",       unit: "百万ルピア/㎡" },
  unitsPerMonth:   { label: "月間販売戸数", unit: "戸/月" },
  monthsToSellout: { label: "完売所要月数", unit: "月" },
  totalUnits:      { label: "総戸数",       unit: "戸" },
  siteArea:        { label: "敷地面積",     unit: "㎡" },
};

const palettes = {
  area: {
    "Jakarta CBD": "#ff5e7d", "Jakarta Pusat": "#ff9d5c", "Jakarta Selatan": "#ffd166",
    "Jakarta Utara": "#4f8cff", "Tangerang": "#00d4b8", "Bekasi": "#9d6bff",
    "Depok": "#5ce1e6", "Bogor": "#7ed957", "Surabaya": "#f06292",
    "Bandung": "#b39ddb", "Bali": "#26c6da", "Makassar": "#aab6c8",
  },
  type: {
    "高層コンド": "#ff5e7d", "中層コンド": "#4f8cff", "タウンハウス": "#00d4b8",
    "戸建": "#ffd166", "ヴィラ": "#9d6bff",
  },
  status: { "完売": "#00d4b8", "販売中": "#4f8cff" },
};

function render() {
  const xKey = document.getElementById("xAxis").value;
  const yKey = document.getElementById("yAxis").value;
  const zKey = document.getElementById("zAxis").value;
  const colorBy = document.getElementById("colorBy").value;
  const sizeBy = document.getElementById("sizeBy").value;
  const showLabels = document.getElementById("showLabels").checked;
  const logZ = document.getElementById("logZ").checked;

  const colorMap = palettes[colorBy];
  const groups = {};
  properties.forEach(p => {
    const key = p[colorBy];
    (groups[key] = groups[key] || []).push(p);
  });

  const sizeValues = p => {
    if (sizeBy === "fixed") return 10;
    const vals = properties.map(q => q[sizeBy]);
    const min = Math.min(...vals), max = Math.max(...vals);
    return 7 + 24 * (p[sizeBy] - min) / (max - min);
  };

  const traces = Object.entries(groups).map(([key, items]) => ({
    name: key,
    type: "scatter3d",
    mode: showLabels ? "markers+text" : "markers",
    x: items.map(p => p[xKey]),
    y: items.map(p => p[yKey]),
    z: items.map(p => p[zKey]),
    text: items.map(p => p.name),
    textposition: "top center",
    textfont: { size: 9, color: "#aab6c8" },
    hovertemplate:
      "<b>%{customdata[0]}</b><br>" +
      `${metrics[xKey].label}: %{x:,.0f} ${metrics[xKey].unit}<br>` +
      `${metrics[yKey].label}: %{y:,.1f} ${metrics[yKey].unit}<br>` +
      `${metrics[zKey].label}: %{z:,.0f} ${metrics[zKey].unit}<br>` +
      "平均価格 円換算: 約%{customdata[3]:,.0f}万円<br>" +
      "%{customdata[1]}｜%{customdata[2]}<extra></extra>",
    customdata: items.map(p => [p.name, `${p.area} / ${p.type}`, p.status, p.avgPrice * IDR_OKU_TO_JPY_MAN]),
    marker: {
      size: items.map(p => sizeValues(p)),
      color: colorMap[key] || "#aab6c8",
      opacity: 0.92,
      line: { color: "rgba(255,255,255,.35)", width: 0.8 },
    },
  }));

  const axisStyle = title => ({
    title: { text: title, font: { size: 11, color: "#aab6c8" } },
    gridcolor: "rgba(120,150,255,.14)",
    zerolinecolor: "rgba(120,150,255,.25)",
    showbackground: true,
    backgroundcolor: "rgba(12,17,28,.55)",
    tickfont: { size: 10, color: "#8a94ad" },
  });

  const layout = {
    paper_bgcolor: "rgba(0,0,0,0)",
    margin: { l: 0, r: 0, t: 6, b: 0 },
    scene: {
      xaxis: axisStyle(`${metrics[xKey].label}（${metrics[xKey].unit}）`),
      yaxis: axisStyle(`${metrics[yKey].label}（${metrics[yKey].unit}）`),
      zaxis: { ...axisStyle(`${metrics[zKey].label}（${metrics[zKey].unit}）${logZ ? "・対数" : ""}`), type: logZ ? "log" : "linear" },
      camera: { eye: { x: 1.7, y: 1.5, z: 0.8 } },
    },
    legend: {
      orientation: "h", y: -0.02,
      font: { color: "#e8ecf6", size: 11 },
      bgcolor: "rgba(0,0,0,0)",
    },
    hoverlabel: {
      bgcolor: "rgba(10,14,24,.95)",
      bordercolor: "rgba(79,140,255,.5)",
      font: { color: "#e8ecf6", size: 12, family: "Inter, Noto Sans JP, sans-serif" },
    },
  };

  Plotly.react("plot", traces, layout, { responsive: true, displaylogo: false });

  const n = properties.length;
  const avg = key => properties.reduce((s, p) => s + p[key], 0) / n;
  document.getElementById("stats").innerHTML = [
    [n + "件", "物件数"],
    [avg("avgPrice").toFixed(0) + "億Rp", "平均価格"],
    [avg("unitsPerMonth").toFixed(1) + "戸/月", "平均販売速度"],
    [(avg("siteArea") / 10000).toFixed(1) + "ha", "平均敷地面積"],
  ].map(([v, k]) => `<div class="stat-card"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
}

["xAxis","yAxis","zAxis","colorBy","sizeBy","showLabels","logZ"].forEach(id =>
  document.getElementById(id).addEventListener("change", render)
);
render();
</script>

</body>
</html>
